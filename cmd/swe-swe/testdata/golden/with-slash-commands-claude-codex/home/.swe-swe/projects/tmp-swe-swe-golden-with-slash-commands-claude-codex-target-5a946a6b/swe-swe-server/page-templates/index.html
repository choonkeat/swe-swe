<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>{{.AssistantName}} - {{.UUIDShort}} - swe-swe</title>
    <script>
        (function(){var m=document.cookie.match(/(?:^|;\s*)swe-swe-theme=([^;]+)/);
        if(m)document.documentElement.setAttribute('data-theme',m[1]);})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/xterm.css?v={{.Version}}">
    <link rel="stylesheet" href="/styles/theme.css?v={{.Version}}">
    <link rel="stylesheet" href="/styles/terminal-ui.css?v={{.Version}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            /* --app-viewport-height is written from window.visualViewport by
               TerminalUI.syncVisibleViewport(). Plain `100%` is the layout
               viewport, which mobile Safari leaves holding a stale height after
               the tab is backgrounded and restored -- the app then paints short
               with a dead band under it. */
            height: var(--app-viewport-height, 100%);
            background: var(--bg-terminal, #1e1e1e);
            overflow: hidden;
        }
        terminal-ui {
            display: block;
            /* Pinned to the band window.visualViewport reports as on screen,
               not just sized to it. When the keyboard opens over a document
               that cannot scroll, mobile Safari scrolls the *visual* viewport
               instead (visualViewport.offsetTop > 0, window.scrollY stays 0).
               A statically positioned app stays anchored at the document
               origin, so its top scrolls off above the visible band and an
               equal strip of dead space appears below it. position: fixed is
               laid out against the layout viewport, which that scroll does not
               move, so top: offsetTop lands the app exactly on the band.
               Both custom properties are written by
               TerminalUI.syncVisibleViewport(); the fallbacks resolve against
               the viewport, matching the old static layout. */
            position: fixed;
            left: 0;
            right: 0;
            top: var(--app-viewport-offset, 0px);
            height: var(--app-viewport-height, 100%);
        }

        @supports (height: 100dvh) {
            /* Ceiling, not a replacement. --app-viewport-height still fixes the
               case it was added for (mobile Safari reporting a stale *short*
               layout viewport, so the app paints short with a dead band under
               it). What it cannot do is stay correct when it goes stale *tall*:
               html/body are overflow:hidden and terminal-ui is position:fixed,
               so the overhanging bottom strip -- which holds the chat input bar
               -- is unreachable until a reload. 100dvh is resolved by the
               browser at paint time and needs no event to stay current, so it
               bounds the damage.

               The plain declarations above come first so a browser without dvh
               keeps a usable height; a bare min(..., 100dvh) would be dropped
               wholesale there. Same shape as the @supports (height: 100dvh)
               block already used for .settings-panel in
               static/styles/terminal-ui.css.

               Deliberately NOT applied to --app-viewport-offset: the reported
               failure is height-only (the app's top was correct in both of the
               reporter's screenshots), and clamping the offset would regress
               the iPhone keyboard fix in 17dcef13b. */
            html, body {
                height: min(var(--app-viewport-height, 100%), 100dvh);
            }
            terminal-ui {
                height: min(var(--app-viewport-height, 100%), 100dvh);
            }
        }
    </style>
</head>
<body>
    <terminal-ui uuid="{{.UUID}}" assistant="{{.Assistant}}" links="" data-local-user-name="{{.LocalUserName}}" data-local-user-email="{{.LocalUserEmail}}" data-where-key="{{.WhereKey}}" data-init-sha="{{.InitSHA}}" data-local-gpg-overrides="{{.LocalGPGOverrides}}" data-local-remote-host="{{.LocalRemoteHost}}"></terminal-ui>
    <script src="/xterm.js?v={{.Version}}"></script>
    <script src="/xterm-addon-fit.js?v={{.Version}}"></script>
    <script src="/link-provider.js?v={{.Version}}"></script>
    <script src="/end-session.js?v={{.Version}}"></script>
    <script type="module" src="/theme-mode.js?v={{.Version}}"></script>
    <script type="module" src="/session-theme.js?v={{.Version}}"></script>
    <script type="module" src="/terminal-ui.js?v={{.Version}}"></script>
</body>
</html>
